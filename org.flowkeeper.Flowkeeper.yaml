app-id: org.flowkeeper.Flowkeeper
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
command: run.sh
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=PYTHONPATH=/app/flowkeeper/
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-modules.yaml

  - name: flowkeeper
    buildsystem: simple
    build-commands:
      - python -m compileall .

      - desktop-file-edit --remove-key=Exec --remove-key=Version flowkeeper/scripts/linux/common/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value="run.sh" flowkeeper/scripts/linux/common/${FLATPAK_ID}.desktop

      - install -Dm644 flowkeeper/scripts/linux/common/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 flowkeeper/scripts/linux/common/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 flowkeeper/flowkeeper-512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm755 run.sh -t ${FLATPAK_DEST}/bin/

      - cd flowkeeper/res; /lib/libexec/rcc -g python --project -o "resources.qrc"
      - cd flowkeeper/res; /lib/libexec/rcc -g python "resources.qrc" -o "../src/fk/desktop/resources.py"

      - mv flowkeeper/src $FLATPAK_DEST/flowkeeper
      - mv flowkeeper/res $FLATPAK_DEST/flowkeeper/

    sources:
      - type: archive
        url: https://github.com/flowkeeper-org/fk-desktop/archive/refs/tags/v1.0.2.tar.gz
        dest: flowkeeper
        sha256: 86cf3f81a1772fb33e123b157361a002d2bff831430af5be97becb675fa2d987

      - type: script
        dest-filename: run.sh
        commands:
          - python /app/flowkeeper/fk/desktop/desktop.py "$@"
